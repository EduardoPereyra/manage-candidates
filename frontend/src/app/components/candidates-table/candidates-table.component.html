<div class="table-container">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let element">{{ element.name }}</td>
    </ng-container>
    <ng-container matColumnDef="surname">
      <th mat-header-cell *matHeaderCellDef>Surname</th>
      <td mat-cell *matCellDef="let element">{{ element.surname }}</td>
    </ng-container>
    <ng-container matColumnDef="seniority">
      <th mat-header-cell *matHeaderCellDef>Seniority</th>
      <td mat-cell *matCellDef="let element">{{ element.seniority }}</td>
    </ng-container>
    <ng-container matColumnDef="yearsOfExperience">
      <th mat-header-cell *matHeaderCellDef>Years of experience</th>
      <td mat-cell *matCellDef="let element">
        {{ element.yearsOfExperience }}
      </td>
    </ng-container>
    <ng-container matColumnDef="availability">
      <th mat-header-cell *matHeaderCellDef>Availability</th>
      <td mat-cell *matCellDef="let element">
        @if (element.availability) {
        <mat-icon
          aria-hidden="false"
          aria-label="true"
          fontIcon="check"
          color="primary"
        ></mat-icon>
        } @else {
        <mat-icon
          aria-hidden="false"
          aria-label="false"
          fontIcon="close"
          color="warn"
        ></mat-icon>
        }
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <button
          mat-mini-fab
          color="primary"
          aria-label="Example icon button with a menu icon"
          (click)="editCandidate(element)"
        >
          <mat-icon>draw</mat-icon>
        </button>
        <button
          mat-mini-fab
          color="warn"
          aria-label="Example icon button with a filter list icon"
          class="delete-button"
          (click)="deleteCandidate(element.id)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
    aria-label="Select page of periodic elements"
    class="mat-elevation-z8"
  >
  </mat-paginator>

  <div class="add-containers">
    <app-candidate-form
      [editingCandidateId]="editingCandidateId"
      (addingCandidate)="onCandidateAdded($event)"
      (candidateEdited)="onSaveEditCandidate($event)"
      (editingCancelled)="onEditingCancelled()"
    ></app-candidate-form>

    @if (!editingCandidateId) {
    <app-candidate-form-with-file
      (candidatesAddedByFile)="onCandidatesAddedByFile($event)"
    ></app-candidate-form-with-file>
    }
  </div>
</div>
